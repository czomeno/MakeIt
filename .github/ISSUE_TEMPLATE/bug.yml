name: Error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Describe el error. Si hay un mensaje en pantalla o en la consola, cópialo.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abre un tablero
        2. Arrastra una tarjeta a...
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: 'Navegador y versión, sistema operativo, Docker o local...'
  - type: markdown
    attributes:
      value: >
        **¿Es una vulnerabilidad de seguridad?** No abras una issue pública:
        sigue las instrucciones de SECURITY.md.
